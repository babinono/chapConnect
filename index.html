<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChapConnect</title>
    <script>
      // Apply saved theme before paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('cc_theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
          // Colour-and-type scheme, independent of light/dark.
          if (localStorage.getItem('cc_scheme') === 'ivy') {
            document.documentElement.classList.add('ivy');
          }
          // Dev experiment: ?look=yearbook turns the yearbook look on,
          // ?look=default turns it off. Remembered per browser.
          var look = new URLSearchParams(location.search).get('look');
          if (look) localStorage.setItem('cc_look', look);
          if (localStorage.getItem('cc_look') === 'yearbook') {
            document.documentElement.classList.add('yearbook');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
